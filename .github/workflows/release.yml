name: release

# Creates a GitHub Release with binaries when a tag like v1.0.0 is pushed:
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 20.04 (glibc 2.31) so the binaries run on older distros too
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.14.2'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavutil-dev libswscale-dev libx11-dev libxtst-dev pkg-config

      - name: Build server
        run: |
          cd server
          qmake server.pro CONFIG+=portable
          make -j$(nproc)

      - name: Build client
        run: |
          cd client
          qmake client.pro CONFIG+=portable
          make -j$(nproc)

      - name: Package
        run: |
          QT_LIBS=$(qmake -query QT_INSTALL_LIBS)
          QT_PLUGINS=$(qmake -query QT_INSTALL_PLUGINS)
          OUT="dist/CyrusDesk-${{ github.ref_name }}-linux-x64"
          mkdir -p "$OUT/lib" "$OUT/plugins/platforms"

          cp server/cyrusdesk-server "$OUT/cyrusdesk-server-bin"
          cp client/cyrusdesk-client "$OUT/cyrusdesk-client-bin"
          cp README.md "$OUT/"

          # Bundle the Qt runtime (libs + ICU + XCB platform plugin) so the
          # tarball runs without a system Qt installation
          cp "$QT_LIBS"/libQt5Core.so.5 "$QT_LIBS"/libQt5Gui.so.5 \
             "$QT_LIBS"/libQt5Widgets.so.5 "$QT_LIBS"/libQt5Network.so.5 \
             "$QT_LIBS"/libQt5XcbQpa.so.5 "$QT_LIBS"/libQt5DBus.so.5 \
             "$QT_LIBS"/libicui18n.so.56 "$QT_LIBS"/libicuuc.so.56 \
             "$QT_LIBS"/libicudata.so.56 "$OUT/lib/"
          cp "$QT_PLUGINS"/platforms/libqxcb.so "$OUT/plugins/platforms/"

          # Launcher scripts so the binaries find the bundled Qt
          for app in cyrusdesk-server cyrusdesk-client; do
            cat > "$OUT/$app" <<EOF
          #!/bin/sh
          DIR=\$(CDPATH= cd -- "\$(dirname -- "\$0")" && pwd)
          export LD_LIBRARY_PATH="\$DIR/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="\$DIR/plugins"
          exec "\$DIR/$app-bin" "\$@"
          EOF
            chmod +x "$OUT/$app"
          done

          tar -czf "CyrusDesk-${{ github.ref_name }}-linux-x64.tar.gz" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: CyrusDesk-*-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download and extract FFmpeg (shared, MSVC import libs)
        shell: pwsh
        run: |
          $ffmpegRoot = "$env:RUNNER_TEMP\ffmpeg"
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z -OutFile "$env:RUNNER_TEMP\ffmpeg.7z"
          7z x "$env:RUNNER_TEMP\ffmpeg.7z" "-o$ffmpegRoot" -y | Out-Null
          $inner = Get-ChildItem $ffmpegRoot -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force C:/ffmpeg | Out-Null
          Copy-Item -Recurse -Force "$($inner.FullName)\*" C:/ffmpeg/

      - name: Build server
        shell: cmd
        run: |
          cd server
          qmake server.pro FFMPEG_DIR=C:/ffmpeg
          nmake

      - name: Build client
        shell: cmd
        run: |
          cd client
          qmake client.pro FFMPEG_DIR=C:/ffmpeg
          nmake

      - name: Package
        shell: pwsh
        run: |
          $out = "dist\CyrusDesk-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Force "$out\server" | Out-Null
          New-Item -ItemType Directory -Force "$out\client" | Out-Null

          Copy-Item server\release\cyrusdesk-server.exe "$out\server\"
          Copy-Item client\release\cyrusdesk-client.exe "$out\client\"

          # Qt runtime DLLs + platform plugin
          & windeployqt --release --no-translations "$out\server\cyrusdesk-server.exe" | Out-Null
          & windeployqt --release --no-translations "$out\client\cyrusdesk-client.exe" | Out-Null

          # FFmpeg runtime DLLs
          Copy-Item C:\ffmpeg\bin\*.dll "$out\server\" -Force
          Copy-Item C:\ffmpeg\bin\*.dll "$out\client\" -Force

          Copy-Item README.md "$out\"
          Compress-Archive -Path "$out" -DestinationPath "CyrusDesk-$env:GITHUB_REF_NAME-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: CyrusDesk-*-windows-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true